<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>Qwen3 FFN forward plus backward latency comparison</title>
<desc>Equivalent BF16 FFN forward-plus-backward calls in a shared local harness compare optimized RL-Kernel and PyTorch CUDA BLAS. The vLLM path is omitted because it is forward-only.</desc>
<rect width="1600" height="820" fill="#ffffff"/>
<text x="800.0" y="42.0" text-anchor="middle" font-size="30" font-weight="500" fill="#111827">Qwen3 FFN forward + backward latency</text>
<text x="800.0" y="72.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4b5563">H=4096, I=12288, BF16 · symmetric TP=1 cores · CUDA-event medians</text>
<rect x="280.0" y="96" width="18" height="18" fill="#7c3aed"/>
<text x="308.0" y="111.0" text-anchor="start" font-size="15" font-weight="400" fill="#111827">RL-Kernel optimized deterministic GEMM</text>
<rect x="800.0" y="96" width="18" height="18" fill="#0891b2"/>
<text x="828.0" y="111.0" text-anchor="start" font-size="15" font-weight="400" fill="#111827">PyTorch CUDA BLAS / cuBLAS</text>
<rect x="135" y="165" width="1400" height="490" fill="none" stroke="#d1d5db"/>
<line x1="135" x2="1535" y1="581.9" y2="581.9" stroke="#d1d5db" stroke-width="1"/>
<text x="123.0" y="586.9" text-anchor="end" font-size="14" font-weight="400" fill="#111827">0.5</text>
<line x1="135" x2="1535" y1="496.3" y2="496.3" stroke="#d1d5db" stroke-width="1"/>
<text x="123.0" y="501.3" text-anchor="end" font-size="14" font-weight="400" fill="#111827">1</text>
<line x1="135" x2="1535" y1="410.7" y2="410.7" stroke="#d1d5db" stroke-width="1"/>
<text x="123.0" y="415.7" text-anchor="end" font-size="14" font-weight="400" fill="#111827">2</text>
<line x1="135" x2="1535" y1="297.5" y2="297.5" stroke="#d1d5db" stroke-width="1"/>
<text x="123.0" y="302.5" text-anchor="end" font-size="14" font-weight="400" fill="#111827">5</text>
<line x1="135" x2="1535" y1="211.9" y2="211.9" stroke="#d1d5db" stroke-width="1"/>
<text x="123.0" y="216.9" text-anchor="end" font-size="14" font-weight="400" fill="#111827">10</text>
<rect x="233.8" y="209.0" width="68.0" height="446.0" fill="#7c3aed"/>
<text x="267.8" y="201.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">10.240</text>
<rect x="318.2" y="582.2" width="68.0" height="72.8" fill="#0891b2"/>
<text x="352.2" y="574.2" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">0.499</text>
<text x="310.0" y="685.0" text-anchor="middle" font-size="15" font-weight="400" fill="#111827">M=1</text>
<text x="310.0" y="710.0" text-anchor="middle" font-size="13" font-weight="500" fill="#111827">RL / cuBLAS: 20.53x</text>
<rect x="583.8" y="208.3" width="68.0" height="446.7" fill="#7c3aed"/>
<text x="617.8" y="200.3" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">10.296</text>
<rect x="668.2" y="614.4" width="68.0" height="40.6" fill="#0891b2"/>
<text x="702.2" y="606.4" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">0.384</text>
<text x="660.0" y="685.0" text-anchor="middle" font-size="15" font-weight="400" fill="#111827">M=8</text>
<text x="660.0" y="710.0" text-anchor="middle" font-size="13" font-weight="500" fill="#111827">RL / cuBLAS: 26.80x</text>
<rect x="933.8" y="289.9" width="68.0" height="365.1" fill="#7c3aed"/>
<text x="967.8" y="281.9" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">5.316</text>
<rect x="1018.2" y="610.5" width="68.0" height="44.5" fill="#0891b2"/>
<text x="1052.2" y="602.5" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">0.397</text>
<text x="1010.0" y="685.0" text-anchor="middle" font-size="15" font-weight="400" fill="#111827">M=32</text>
<text x="1010.0" y="710.0" text-anchor="middle" font-size="13" font-weight="500" fill="#111827">RL / cuBLAS: 13.40x</text>
<rect x="1283.8" y="280.1" width="68.0" height="374.9" fill="#7c3aed"/>
<text x="1317.8" y="272.1" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">5.757</text>
<rect x="1368.2" y="605.0" width="68.0" height="50.0" fill="#0891b2"/>
<text x="1402.2" y="597.0" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">0.415</text>
<text x="1360.0" y="685.0" text-anchor="middle" font-size="15" font-weight="400" fill="#111827">M=128</text>
<text x="1360.0" y="710.0" text-anchor="middle" font-size="13" font-weight="500" fill="#111827">RL / cuBLAS: 13.88x</text>
<text x="57.0" y="410.0" text-anchor="middle" font-size="15" font-weight="400" fill="#111827" transform="rotate(-90 57.0 410.0)">Median forward + backward latency (ms, log scale)</text>
<text x="800.0" y="742.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">vLLM PR #53247 is forward-only; this benchmark has no vLLM backward path.</text>
<text x="800.0" y="772.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">Both series include complete three-GEMM FFN forward and backward calls.</text>
</svg>
