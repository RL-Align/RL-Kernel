<text x="57.0" y="410.0" text-anchor="middle" font-size="15" font-weight="400" fill="#111827" transform="rotate(-90 57.0 410.0)">Median forward latency (ms, log scale)</text>
<text x="800.0" y="742.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">vLLM is forward-only. Qwen3-8B projection shapes use the upstream default BF16 fallback configuration.</text>
<text x="800.0" y="772.0" text-anchor="middle" font-size="15" font-weight="400" fill="#4b5563">Operator benchmark only; the vLLM series uses vendored persistent matmul code, not end-to-end vLLM serving.</text>
</svg>
