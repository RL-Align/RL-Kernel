<rect x="212.6" y="216.6" width="58.0" height="438.4" fill="#7c3aed"/>
<text x="241.6" y="208.6" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">1.698</text>
<rect x="281.0" y="422.1" width="58.0" height="232.9" fill="#d97706"/>
<text x="310.0" y="414.1" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">0.421</text>
