<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>Qwen3 FFN forward latency comparison</title>
<desc>Equivalent BF16 FFN forward calls in a shared local harness compare optimized RL-Kernel, vLLM batch-invariant persistent matmul, and PyTorch CUDA BLAS.</desc>
<rect width="1600" height="820" fill="#ffffff"/>
<text x="800.0" y="42.0" text-anchor="middle" font-size="30" font-weight="500" fill="#111827">Qwen3 FFN forward latency</text>
<text x="800.0" y="72.0" text-anchor="middle" font-size="17" font-weight="400" fill="#4b5563">H=4096, I=12288, BF16 · symmetric TP=1 cores · CUDA-event medians</text>
<rect x="140.0" y="96" width="18" height="18" fill="#7c3aed"/>
<text x="168.0" y="111.0" text-anchor="start" font-size="15" font-weight="400" fill="#111827">RL-Kernel optimized deterministic GEMM</text>
<rect x="580.0" y="96" width="18" height="18" fill="#d97706"/>
<text x="608.0" y="111.0" text-anchor="start" font-size="15" font-weight="400" fill="#111827">vLLM batch-invariant persistent matmul (PR #53247)</text>
<rect x="1020.0" y="96" width="18" height="18" fill="#0891b2"/>
<text x="1048.0" y="111.0" text-anchor="start" font-size="15" font-weight="400" fill="#111827">PyTorch CUDA BLAS / cuBLAS</text>
<rect x="135" y="165" width="1400" height="490" fill="none" stroke="#d1d5db"/>
