# Engine config of the rlkernel backend (RlkEngineConfig)
_target_: rl_engine.integrations.dsv4.verl_engine.RlkEngineConfig

# Strategy (backend) name
strategy: rlkernel

# Offload is not supported
param_offload: False

optimizer_offload: False

# Forward only (reference policy)
forward_only: False

# LoRA rank and alpha (keep model.lora_rank at 0: it would turn on vLLM's own LoRA)
lora_rank: 0

lora_alpha: 16

# Which LoRA adapters to create
lora_attention: True

lora_moe: True

lora_shared_expert: True

# Seed of the adapters' initialization
lora_seed: 42

# Rows per FP32 logits chunk for the entropy metric
entropy_chunk_rows: 1024

seed: 42
