# SPDX-License-Identifier: Apache-2.0
name: Qwen-Image RoPE

on:
  pull_request:
    branches: [test-qwenimage]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU reference dependencies
        run: |
          python -m pip install pip==25.3 setuptools==80.9.0 wheel==0.45.1
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-build-isolation -e . pytest
      - name: Run CPU contracts, input registration and build-profile checks
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest -q -rs \
            tests/ops/rope/test_multi_axis_rope.py \
            tests/validation/operators/test_operator_inputs.py \
            tests/build/test_multi_axis_rope_build.py \
            --junitxml=artifacts/rope-cpu.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rope-cpu-${{ matrix.python-version }}
          path: artifacts/rope-cpu.xml

  static-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install pre-commit==4.3.0 -r requirements/docs.txt
      - name: Check changed files
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as stream:
              event = json.load(stream)
          base = event.get('pull_request', {}).get('base', {}).get('sha')
          if base:
              assert re.fullmatch(r'[0-9a-f]{40}', base)
          else:
              base = 'HEAD^'
          changed = subprocess.check_output([
              'git', 'diff', '--name-only', '--diff-filter=ACMR', '-z', base, 'HEAD'
          ]).decode('utf-8').split('\0')
          files = [('./' + path if path.startswith('-') else path) for path in changed if path]
          if files:
              subprocess.check_call([sys.executable, '-m', 'pre_commit', 'run', '--files', *files])
          PY
      - name: Build documentation
        run: mkdocs build --strict -f mkdocs.yaml
