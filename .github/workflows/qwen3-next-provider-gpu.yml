# SPDX-License-Identifier: Apache-2.0
# RFC #428 Qwen3-Next provider comparisons: the C1/C3/C4 norm providers, the C6
# GDN decode-step goldens, the shared GEMM/MoE route-combine provider and the TP4
# GDN/convolution/attention mixers, each checked against the real vLLM 0.30.0 provider.
#
# These check_ files import vLLM, so the default pytest collection never runs them
# (tests/integrations/common/test_framework_operator_integrations.py asserts vLLM is not imported). This
# workflow runs them in their own process on a self-hosted runner that a maintainer
# registers with the labels below and keeps on the audited runtime (CUDA 13,
# torch 2.13.0+cu130, vLLM 0.30.0). Without such a runner the job queues rather than
# reporting a false pass.
#
# Security: do not use pull_request_target. Fork PRs never reach the self-hosted
# runner; a maintainer dispatches the reviewed commit from a trusted branch and
# names the repository and 40-character SHA to run. Only the format is checked
# below: the dispatcher needs write access to the repository and is responsible for
# naming a commit that has been reviewed (as in ws1-chain-npu.yml).

name: Qwen3-Next-provider-GPU

on:
  pull_request:
    branches: [main, test-qwennext]
    paths:
      - "rl_engine/backends/**"
      - "rl_engine/reference/**"
      - "csrc/cuda/attention/**"
      - "rl_engine/models/qwen3_next/**"
      - "rl_engine/integrations/engines/train/vllm/qwen3_next*"
      - "rl_engine/validation/models/qwen3_next*"
      - "tools/validation/models/*qwen3_next*"
      - "rl_engine/validation/models/qwen3_next/**"
      - "tools/validation/models/qwen3_next/**"
      - "tests/models/qwen3_next/**"
      - "rl_engine/config/**"
      - "rl_engine/validation/common/**"
      - "csrc/cuda/norm/**"
      - "csrc/bindings/**"
      - "rl_engine/contracts/**"
      - ".github/workflows/qwen3-next-provider-gpu.yml"
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Public repository containing the reviewed commit (owner/name)"
        required: true
        default: "RL-Align/RL-Kernel"
        type: string
      source_sha:
        description: "Exact reviewed 40-character commit SHA to execute on the runner"
        required: true
        type: string

concurrency:
  group: qwen3-next-provider-gpu-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fork-pr-notice:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Report required trusted execution
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Fork code does not run on the self-hosted Qwen3-Next provider runner."
          echo "A maintainer must dispatch this workflow from a trusted upstream branch."
          printf 'source_repository=%s\n' "$HEAD_REPO"
          printf 'source_sha=%s\n' "$HEAD_SHA"

  provider:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, rl-kernel-qwen3-next]
    timeout-minutes: 30
    env:
      # A missing _C must fail the job, not skip every CUDA case.
      RL_KERNEL_REQUIRE_EXT: "1"
    steps:
      - name: Validate the dispatched source
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]

      - name: Checkout the reviewed commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.source_repository || github.repository }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require the audited runtime
        run: |
          python3 - <<'PY'
          import torch, vllm
          assert torch.__version__ == "2.13.0+cu130"
          assert vllm.__version__ == "0.30.0"
          assert torch.cuda.is_available()
          PY
      - name: Build the extension against that runtime
        # The runner is long-lived: remove any extension or build tree left by an earlier
        # job so setuptools cannot judge a stale _C up to date and skip the rebuild.
        run: |
          find . -name '_C*.so' -not -path './.git/*' -delete
          rm -rf build
          python3 setup.py build_ext --inplace
      - name: Fail fast when the extension is missing or built for the wrong architecture
        run: python3 tools/checks/ci_smoke.py
      - name: Require the extension built from this checkout
        # A stale editable install elsewhere on the runner would otherwise satisfy the
        # import and test some other tree's _C.
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          from rl_engine import _C

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          loaded = Path(_C.__file__).resolve()
          assert workspace in loaded.parents, f"rl_engine._C loaded from {loaded}, outside {workspace}"
          print("rl_engine._C:", loaded)
          PY
      - name: Check pinned providers in their own process
        # The FP32 router needs IEEE Triton dots from process start.
        env:
          TRITON_F32_DEFAULT: ieee
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/provider-pytest.log"
          python3 -m pytest -q -rs tests/models/qwen3_next/check_qwen3_next_norm_providers.py tests/models/qwen3_next/check_gdn_recurrent_golden.py \
            tests/models/qwen3_next/check_qwen3_next_forward.py tests/models/qwen3_next/check_qwen3_next_attention.py \
            tests/models/qwen3_next/check_qwen3_next_gdn_bridge.py tests/models/qwen3_next/check_qwen3_next_gdn_sequence.py \
            tests/models/qwen3_next/check_qwen3_next_conv_bridge.py tests/models/qwen3_next/check_qwen3_next_core_matrix.py \
            tests/models/qwen3_next/check_qwen3_next_shared_core.py | tee "$log"
          # Fail closed: these modules skip as a whole when CUDA or vLLM is missing, and pytest
          # exits 0 for an all-skipped run. A skipped provider check is not provider evidence.
          if grep -Eq '^SKIPPED|[0-9]+ skipped' "$log"; then
            echo "::error::a provider check was skipped"
            exit 1
          fi
          grep -Eq '[0-9]+ passed' "$log"
