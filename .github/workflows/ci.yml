name: CI-Pipeline

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]

permissions:
  contents: read

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

      - name: Install MyPy
        run: pip install mypy

      - name: Run MyPy
        run: mypy --ignore-missing-imports rl_engine/

  unit-tests:
    needs: linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "==> Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo "==> After cleanup:"
          df -h

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run Mocked Hardware Discovery Tests
        run: |
          python -m pytest rl_engine/tests/test_dispatch.py -v
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/test_attention_correctness.py -q -rs
          python -m pytest tests/test_forward_invariance.py tests/test_tolerance_contract.py tests/test_ws1_workload.py tests/test_gradient_invariance.py tests/test_elementwise_inventory.py tests/test_four_judgment_matrix.py tests/test_op_checks.py tests/test_operator_inputs.py tests/test_profiler.py tests/test_kv_consistency.py tests/test_ws1_qwen3_dense.py tests/test_ws1_chain_integration.py tests/test_qwen3_next_norm.py tests/test_gdn_state_contract.py -q

      - name: Run Cross-Configuration Contract Tests (CPU-safe)
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q \
            tests/test_cross_config_*.py \
            tests/test_stateless_executor.py \
            tests/test_tolerance_contract.py \
            tests/test_kernel_registry.py

      - name: Run Attention Ground-Truth Tests (CPU-safe)
        run: |
          python -m pytest tests/test_attention.py -v -k "not large and not gpu"

      - name: Run WS2 Attention Cross-Configuration Tests (CPU-safe)
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q \
            tests/test_attention_ablation.py \
            tests/test_attention_contract.py \
            tests/test_attention_cross_config_binding.py \
            tests/test_attention_preprocess.py \
            tests/test_attention_projection.py \
            tests/test_framework_runtime_adapters.py \
            tests/test_rocm_e2e_ablation.py \
            tests/test_cp_attention.py \
            tests/test_cp_attention_transformer_engine.py

      - name: Run KV-Cache Attention Ground-Truth Tests (CPU-safe)
        run: |
          python -m pytest tests/test_kv_cache_attention.py -v -k "not large and not gpu"

      - name: Run WS2 Attention Contract Tests (CPU-safe)
        run: python -m pytest tests/test_attention_contract.py -v

      - name: Run WS2 Logprob Contract Tests (CPU-safe)
        run: |
          python -m pytest \
            tests/test_logprob_contract.py \
            tests/test_rocm_lm_head_weight_cache.py \
            -v

      - name: Run WS2 Vocab-Parallel Logprob Tests (CPU-safe)
        run: python -m pytest tests/test_vocab_parallel_logp.py -v

      - name: Run WS2 Wrapper Interface and FFN Tests (CPU-safe)
        run: |
          python -m pytest -q \
            tests/test_alignment_wrapper_interfaces.py \
            tests/test_qwen_ffn.py \
            tests/test_rocm_benchmark_cleanup.py \
            tests/test_rocm_collective_benchmark.py \
            tests/test_rocm_paged_workspace.py \
            tests/test_collective_ipc_errors.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Documentation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build Documentation
        run: mkdocs build --strict -f mkdocs.yaml
