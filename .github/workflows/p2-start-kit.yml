name: P2 start-kit CPU conformance

on:
  pull_request:
    paths:
      - "rl_engine/p2/**"
      - "tests/p2/**"
      - "scripts/p2_distributed_smoke.py"
      - ".github/workflows/p2-start-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pytest ruff
      - run: python -m ruff check rl_engine/p2 tests/p2 scripts/p2_distributed_smoke.py
      - run: python -m ruff format --check rl_engine/p2 tests/p2 scripts/p2_distributed_smoke.py
      - run: python -m pytest tests/p2 -q --junitxml=p2-results.xml
      - run: python -m rl_engine.p2 conformance --tokens 513 --output p2-artifact
      - run: python -m rl_engine.p2 verify p2-artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-start-kit-py${{ matrix.python }}
          path: |
            p2-results.xml
            p2-artifact/
          retention-days: 14
