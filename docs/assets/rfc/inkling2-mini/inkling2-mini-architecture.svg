<rect class="box" x="85" y="628" width="300" height="210" rx="11"/>
<text x="235" y="662" class="label" text-anchor="middle">PRELUDE | stored 0–5</text>
<text x="235" y="690" class="small" text-anchor="middle">6 visits | once only</text>
<text x="235" y="714" class="small" text-anchor="middle">AttnRes + hybrid attention + MoE</text>
<rect class="panel" x="461" y="574" width="678" height="306" rx="14"/>
<text x="800" y="610" class="green" text-anchor="middle">LOOP CORE | stored layers 6–17</text>
<text x="800" y="638" class="small" text-anchor="middle">12 shared physical layers × 3 passes = 36 logical visits</text>
<text x="800" y="664" class="tiny" text-anchor="middle">Each pass restarts from the same prelude state</text>
<rect class="box" x="482" y="709" width="196" height="125" rx="11"/>
<text x="580" y="743" class="label" text-anchor="middle">PASS 1</text>
<text x="580" y="771" class="small" text-anchor="middle">12 logical visits</text>
<text x="580" y="795" class="small" text-anchor="middle">no previous message</text>
<text x="580" y="822" class="tiny" text-anchor="middle">own KV + conv cache</text>
<rect class="box" x="702" y="709" width="196" height="125" rx="11"/>
<text x="800" y="743" class="label" text-anchor="middle">PASS 2</text>
<text x="800" y="771" class="small" text-anchor="middle">12 logical visits</text>
<text x="800" y="795" class="small" text-anchor="middle">reads pass-1 blocks</text>
<text x="800" y="822" class="tiny" text-anchor="middle">own KV + conv cache</text>
<rect class="box" x="922" y="709" width="196" height="125" rx="11"/>
<text x="1020" y="743" class="label" text-anchor="middle">PASS 3</text>
<text x="1020" y="771" class="small" text-anchor="middle">12 logical visits</text>
<text x="1020" y="795" class="small" text-anchor="middle">reads pass-2 blocks</text>
<text x="1020" y="822" class="tiny" text-anchor="middle">own KV + conv cache</text>
<rect class="box" x="1211" y="628" width="300" height="210" rx="11"/>
<text x="1361" y="662" class="label" text-anchor="middle">CODA | stored 18–23</text>
<text x="1361" y="690" class="small" text-anchor="middle">6 visits | once only</text>
<text x="1361" y="714" class="small" text-anchor="middle">continues from pass 3</text>
