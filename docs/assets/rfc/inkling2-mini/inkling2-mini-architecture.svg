</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#60806d"/></marker><marker id="dasharrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#809c8e"/></marker></defs>
<rect width="1600" height="1220" fill="white"/>
<text x="80" y="59" class="title" text-anchor="start">Inkling 2 Mini — RL-Kernel train / rollout consistency map</text>
<text x="80" y="87" class="sub" text-anchor="start">CUDA + ROCm | VIME Native vs VIME + RL-Kernel | Text-first, then full image-text parity</text>
<rect class="dash" x="85" y="142" width="334" height="73" rx="11"/>
<text x="252" y="172" class="label" text-anchor="middle">Text input</text>
<text x="252" y="197" class="small" text-anchor="middle">token IDs, positions and masks</text>
<rect class="dash" x="1180" y="142" width="334" height="73" rx="11"/>
<text x="1347" y="172" class="label" text-anchor="middle">Image input</text>
<text x="1347" y="197" class="small" text-anchor="middle">pixel values</text>
<rect class="box" x="85" y="254" width="334" height="92" rx="11"/>
<text x="252" y="288" class="label" text-anchor="middle">Token embedding</text>
<text x="252" y="316" class="small" text-anchor="middle">hidden 2304 | valid vocab 200058</text>
<rect class="box" x="1180" y="254" width="334" height="92" rx="11"/>
<text x="1347" y="288" class="label" text-anchor="middle">Vision encoder</text>
<text x="1347" y="316" class="small" text-anchor="middle">23-layer ViT | hidden 1024</text>
