<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220">
<defs><style>
.title{font:700 27px Arial,Helvetica,sans-serif;fill:#1f3b2f}
.sub{font:15px Arial,Helvetica,sans-serif;fill:#506458}
.label{font:700 18px Arial,Helvetica,sans-serif;fill:#1f3b2f}
.small{font:15px Arial,Helvetica,sans-serif;fill:#496253}
.tiny{font:13px Arial,Helvetica,sans-serif;fill:#506458}
.green{font:700 16px Arial,Helvetica,sans-serif;fill:#16754f}
.wlabel{font:700 18px Arial,Helvetica,sans-serif;fill:white}
.wsmall{font:14px Arial,Helvetica,sans-serif;fill:#ecf6f0}
.foot{font:700 14px Arial,Helvetica,sans-serif;fill:#16754f}
.box{fill:#fff;stroke:#7b9b88;stroke-width:1.5}
