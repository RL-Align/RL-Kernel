<path class="dline" d="M898 767L922 767" marker-end="url(#dasharrow)"/>
<text x="690" y="750" class="tiny" text-anchor="middle">msg</text>
<text x="911" y="750" class="tiny" text-anchor="middle">msg</text>
<path class="line" d="M1139 731L1211 731" marker-end="url(#arrow)"/>
<rect class="box" x="85" y="927" width="414" height="110" rx="11"/>
<text x="292" y="961" class="label" text-anchor="middle">Hybrid relative attention</text>
<text x="292" y="989" class="small" text-anchor="middle">5 local : 1 global | Q24 / KV8 / D128</text>
<text x="292" y="1013" class="small" text-anchor="middle">local window 1024 | relative bias + sink</text>
<rect class="box" x="1101" y="927" width="413" height="110" rx="11"/>
<text x="1307.5" y="961" class="label" text-anchor="middle">MoE + per-visit state</text>
<text x="1307.5" y="989" class="small" text-anchor="middle">128 routed experts | top-8 | short conv k4</text>
<text x="1307.5" y="1013" class="small" text-anchor="middle">shared weights, isolated visit caches</text>
<rect class="core" x="570" y="930" width="460" height="96" rx="11"/>
<text x="800" y="964" class="wlabel" text-anchor="middle">Output / LM head</text>
<text x="800" y="992" class="wsmall" text-anchor="middle">valid vocab, FP32 softcap 30</text>
<path class="line" d="M1361 838L1361 896L800 896L800 930" marker-end="url(#arrow)"/>
<rect class="dash" x="632" y="1062" width="337" height="86" rx="11"/>
<text x="800.5" y="1096" class="label" text-anchor="middle">Selected-token logprob</text>
<text x="800.5" y="1124" class="small" text-anchor="middle">fixed vocab reduction | exact compare</text>
<path class="line" d="M800 1026L800 1062" marker-end="url(#arrow)"/>
<text x="85" y="1193" class="foot" text-anchor="start">WS1: exact per-visit arithmetic   |   WS2: TP / EP / CP determinism   |   Target: zero bit mismatch + competitive throughput</text>
