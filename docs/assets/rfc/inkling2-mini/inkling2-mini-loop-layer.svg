<text x="423.5" y="793" class="small" text-anchor="middle">kernel size 4 | per-pass conv-state cache</text>
<rect class="box" x="883" y="738" width="587" height="83" rx="11"/>
<text x="1176.5" y="768" class="label" text-anchor="middle">Sigmoid router + stable top-8</text>
<text x="1176.5" y="793" class="small" text-anchor="middle">128 experts | selection-only routing bias</text>
<path class="line" d="M423 713L423 738" marker-end="url(#arrow)"/>
<path class="line" d="M1177 713L1177 738" marker-end="url(#arrow)"/>
