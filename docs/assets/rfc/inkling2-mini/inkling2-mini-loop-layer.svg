<rect class="panel" x="80" y="565" width="691" height="521" rx="14"/>
<text x="426" y="600" class="green" text-anchor="middle">HYBRID RELATIVE ATTENTION</text>
<rect class="panel" x="829" y="565" width="691" height="521" rx="14"/>
