<text x="423.5" y="901" class="small" text-anchor="middle">5 local window 1024 : 1 full | fixed softmax/reduction</text>
<rect class="box" x="883" y="846" width="587" height="83" rx="11"/>
<text x="1176.5" y="876" class="label" text-anchor="middle">Expert SwiGLU gate / up / down</text>
