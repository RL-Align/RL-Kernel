repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Unified diffs include significant context markers and pinned hashes.
        # Published Qwen3-Next chain evidence is byte-exact (SHA256SUMS).
        exclude: '(\.patch$|^reports/archive/|^docs/usage/evidence/qwen3-next-chain-b200/)'
      - id: end-of-file-fixer
        exclude: '^(reports/archive/|docs/usage/evidence/qwen3-next-chain-b200/)'
      - id: check-yaml
        exclude: 'mkdocs\.yaml$'
      - id: check-added-large-files
        exclude: '^(docs/assets/|reports/archive/)'

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        exclude: ^reports/archive/
        args: [--line-length=100]

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        exclude: ^reports/archive/
        args: ["--profile", "black", "--line-length=100"]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--extend-ignore=E203,E704"]
